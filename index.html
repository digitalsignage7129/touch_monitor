<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>工事案内タッチサイネージ</title>
<style>
  :root{
    --bg: #1B2430;
    --panel: #26313F;
    --panel-hi: #2F3D4D;
    --accent: #F5A623;
    --safety: #FF6B35;
    --text: #F2F0EA;
    --text-dim: #8FA0B3;
    --good: #7CD98A;
    --bad: #FF6B6B;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{
    width:100%; height:100%;
    background:var(--bg);
    color:var(--text);
    font-family: "Zen Kaku Gothic New","Noto Sans JP","Hiragino Kaku Gothic ProN",sans-serif;
    overflow:hidden;
    -webkit-user-select:none; user-select:none;
  }
  #app{position:relative; width:100vw; height:100vh; display:flex; flex-direction:column;}
  .stripe-bar{
    height:12px; width:100%;
    background: repeating-linear-gradient(135deg, var(--accent) 0 18px, var(--bg) 18px 36px);
    flex-shrink:0;
  }
  header{ display:flex; flex-direction:column; padding: 18px 40px 12px; flex-shrink:0; }
  .eyebrow{ font-size:14px; letter-spacing:0.12em; color:var(--accent); font-weight:700; margin-bottom:4px; }
  h1{ font-size:26px; font-weight:900; letter-spacing:0.02em; }

  #grid-view{ flex:1; min-height:0; display:flex; flex-direction:column; }
  .grid-wrap{
    flex:1; min-height:0;
    padding: 8px 40px 16px;
    display:grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    grid-template-rows: repeat(2, minmax(0, 1fr));
    gap: 20px;
  }
  .tile{
    background:var(--panel); border-radius:16px;
    position:relative; overflow:hidden; min-height:0;
    display:flex; flex-direction:column; justify-content:flex-end;
    cursor:pointer; border: 2px solid transparent;
    transition: transform .15s ease, border-color .15s ease, background .15s ease;
  }
  .tile.empty{
    cursor:default; display:flex; align-items:center; justify-content:center;
    color:var(--text-dim); font-size:14px; opacity:0.4;
  }
  .tile.quiz-tile{ background: linear-gradient(135deg, #2F3D4D, #26313F); }
  .tile:not(.empty):active{ transform: scale(0.97); border-color:var(--accent); background:var(--panel-hi); }
  .tile-media{ position:absolute; top:0; left:0; right:0; bottom:0; display:flex; align-items:center; justify-content:center; overflow:hidden; background:#10151c; }
  .tile-media img, .tile-media video{ width:100%; height:100%; object-fit:cover; }
  .tile-media .fallback-icon{ font-size:48px; opacity:0.5; }
  .tile-label{
    position:relative; padding: 14px 16px 14px;
    background: linear-gradient(0deg, rgba(0,0,0,0.6), rgba(0,0,0,0));
    font-size:18px; font-weight:700;
  }
  .tile-tag{
    position:absolute; top:12px; left:12px; font-size:11px; font-weight:700; letter-spacing:.05em;
    background:var(--accent); color:#20242b; padding:3px 9px; border-radius:999px; z-index:2;
  }
  .play-badge{
    position:absolute; top:12px; right:12px; z-index:2;
    width:34px; height:34px; border-radius:50%;
    background:rgba(0,0,0,0.55); display:flex; align-items:center; justify-content:center;
  }
  .play-badge::after{
    content:""; width:0; height:0; margin-left:3px;
    border-left:11px solid var(--text); border-top:7px solid transparent; border-bottom:7px solid transparent;
  }

  footer{
    flex-shrink:0; padding: 10px 40px; display:flex; justify-content:space-between; align-items:center;
    border-top:1px solid rgba(255,255,255,0.08); font-size:13px; color:var(--text-dim);
  }
  .dot{ display:inline-block; width:8px; height:8px; border-radius:50%; background:var(--safety); margin-right:8px; box-shadow: 0 0 0 4px rgba(255,107,53,0.18); }
  #syncBadge{ font-size:11px; padding:2px 8px; border-radius:999px; background:var(--panel-hi); margin-left:10px; }

  /* ---- メディアビューア(画像・動画・PDF) ---- */
  #viewer-view{ display:none; position:absolute; top:0; left:0; right:0; bottom:0; width:100%; height:100%; background:#000; z-index:100; }
  #viewer-view.active{ display:block; }
  .viewer-stage{
    position:absolute; top:0; left:0; right:0; bottom:0; width:100%; height:100%;
    display:flex; align-items:center; justify-content:center;
    color:var(--text-dim); font-size:20px; text-align:center; background:#000;
  }
  .viewer-stage img, .viewer-stage video{ max-width:100%; max-height:100%; }

  .viewer-topbar{
    position:absolute; top:0; left:0; right:0; z-index:50;
    display:flex; align-items:center; justify-content:space-between;
    padding: 18px 24px;
    background: linear-gradient(180deg, rgba(0,0,0,0.75), rgba(0,0,0,0));
    pointer-events:none;
  }
  .back-btn{
    pointer-events:auto;
    display:flex; align-items:center; gap:10px;
    background:rgba(38,49,63,0.92);
    border:2px solid var(--accent);
    color:var(--text); font-size:18px; font-weight:700;
    padding: 14px 26px; border-radius:14px; cursor:pointer;
  }
  .back-btn:active{ background:var(--accent); color:#20242b; }
  .viewer-title{ pointer-events:auto; font-size:15px; font-weight:700; color:var(--text); background:rgba(0,0,0,0.5); padding:8px 14px; border-radius:10px; }

  /* ---- スクリーンセーバー(10分無操作で表示) ---- */
  #screensaver-view{
    display:none; position:absolute; top:0; left:0; right:0; bottom:0;
    width:100%; height:100%; z-index:200; background:#000; cursor:pointer;
  }
  #screensaver-view.active{ display:block; }
  #screensaverVideo{ width:100%; height:100%; object-fit:cover; }
  .screensaver-overlay{
    position:absolute; top:0; left:0; right:0; bottom:0;
    display:flex; align-items:center; justify-content:center;
    background:rgba(0,0,0,0.25);
  }
  .screensaver-text{
    text-align:center; color:#fff; font-size:44px; font-weight:900;
    letter-spacing:0.08em; text-shadow:0 4px 18px rgba(0,0,0,0.6);
    animation: screensaverPulse 2.2s ease-in-out infinite;
  }
  .screensaver-text span{
    display:block; font-size:22px; font-weight:700; margin-top:14px; letter-spacing:0.04em;
  }
  @keyframes screensaverPulse{
    0%, 100% { opacity:1; }
    50% { opacity:0.55; }
  }
  .scroll-hint{
    position:absolute; left:50%; bottom:28px; z-index:40;
    transform:translateX(-50%);
    display:flex; flex-direction:column; align-items:center; gap:6px;
    pointer-events:none;
    background:rgba(0,0,0,0.55);
    padding:12px 22px; border-radius:999px;
    color:var(--text); font-size:15px; font-weight:700;
    animation: scrollHintFade 2.5s ease-in-out infinite;
  }
  .scroll-hint .arrow{
    width:16px; height:16px;
    border-right:4px solid var(--accent); border-bottom:4px solid var(--accent);
    transform:rotate(45deg);
  }
  .scroll-hint.hide{ opacity:0; transition: opacity 0.6s ease; }
  @keyframes scrollHintFade{
    0%, 100% { transform:translate(-50%, 0); opacity:1; }
    50% { transform:translate(-50%, 8px); opacity:0.6; }
  }

  /* ---- クイズビューア ---- */
  #quiz-view{ display:none; position:absolute; top:0; left:0; right:0; bottom:0; width:100%; height:100%; background: linear-gradient(160deg, #1B2430, #263444); z-index:100; }
  #quiz-view.active{ display:flex; flex-direction:column; }
  .quiz-body{
    flex:1; min-height:0; display:flex; flex-direction:column; align-items:center; justify-content:center;
    padding: 90px 60px 40px; text-align:center;
  }
  .quiz-progress{ font-size:15px; color:var(--accent); font-weight:700; margin-bottom:14px; }
  .quiz-question-emoji{ font-size:64px; margin-bottom:10px; line-height:1; }
  .quiz-question{ font-size:30px; font-weight:900; max-width:900px; margin-bottom:36px; line-height:1.5; }
  .quiz-choices{ display:grid; grid-template-columns: repeat(2, minmax(260px, 1fr)); gap:18px; width:100%; max-width:900px; }
  .quiz-choice{
    background:var(--panel); border:3px solid transparent; border-radius:16px;
    padding:22px 20px; font-size:20px; font-weight:700; cursor:pointer; color:var(--text);
  }
  .quiz-choice:active{ transform: scale(0.98); }
  .quiz-choice.correct{ border-color:var(--good); background:#1F3327; }
  .quiz-choice.wrong{ border-color:var(--bad); background:#3A1F1F; }
  .quiz-feedback{ margin-top:28px; font-size:28px; font-weight:900; }
  .quiz-feedback.correct-text{ color:var(--good); }
  .quiz-feedback.wrong-text{ color:var(--bad); }
  .quiz-explain{ margin-top:12px; font-size:17px; color:var(--text-dim); max-width:820px; line-height:1.6; }
  .quiz-next{
    margin-top:30px; background:var(--accent); color:#20242b; border:none;
    padding:16px 46px; border-radius:14px; font-size:18px; font-weight:800; cursor:pointer;
  }
  .quiz-result-emoji{ font-size:70px; margin-bottom:10px; }
  .quiz-result-text{ font-size:26px; font-weight:900; margin-bottom:10px; }
  .quiz-result-sub{ font-size:17px; color:var(--text-dim); max-width:700px; line-height:1.7; }
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script>
  if (window.pdfjsLib) {
    pdfjsLib.GlobalWorkerOptions.workerSrc =
      "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
  }
</script>

<body>
<div id="app">

  <div id="grid-view">
    <div class="stripe-bar"></div>
    <header>
      <div class="eyebrow">工事のお知らせ / SITE INFORMATION</div>
      <h1>ご覧になりたい項目をタップしてください</h1>
    </header>

    <div class="grid-wrap" id="gridWrap"></div>

    <footer>
      <div><span class="dot"></span>コンテンツは定期的に更新されます<span id="syncBadge">確認中…</span></div>
      <div id="clock"></div>
    </footer>
  </div>

  <div id="viewer-view">
    <div class="viewer-stage" id="viewerStage"></div>
    <div class="viewer-topbar">
      <button class="back-btn" id="backBtn">&larr; 一覧に戻る</button>
      <div class="viewer-title" id="viewerTitle"></div>
    </div>
  </div>

  <div id="quiz-view">
    <div class="viewer-topbar">
      <button class="back-btn" id="quizBackBtn">&larr; 一覧に戻る</button>
      <div class="viewer-title">日本国土開発クイズ</div>
    </div>
    <div class="quiz-body" id="quizBody"></div>
  </div>

  <div id="screensaver-view">
    <video id="screensaverVideo" muted playsinline loop></video>
    <div class="screensaver-overlay">
      <div class="screensaver-text">
        PLEASE TOUCH SCREEN<br>
        <span>画面にタッチしてください</span>
      </div>
    </div>
  </div>

</div>

<script>
/* =========================================================
   5枠(アップロード可能) + 1枠固定クイズ の計6枠表示
   ・manifest.json 各itemは slot(1〜5)を持つ
   ・manifest.json の screensaver フィールドにスクリーンセーバー動画URLを保持
   ・type: image / video / pdf に対応
   ・動画サムネイルは再生させず、静止画キャプチャに変換して表示
   ・PDFは範囲リクエスト(Range)対応でpdf.jsに直接読み込ませ、
     全体ダウンロードを待たずに表示を開始する
   ========================================================= */

const MANIFEST_URL = "manifest.json";
const CONTENT_CACHE = "signage-content-v4";
const VERSION_KEY = new Request("https://internal.local/content-version-marker");
const SYNC_INTERVAL_MS = 10 * 60 * 1000; // 10分
const SLOT_COUNT = 5; // アップロード枠は5つ(残り1枠は固定クイズ)

if ("serviceWorker" in navigator) {
  navigator.serviceWorker.register("sw.js").catch(() => {});
}

async function getCachedVersion(cache) {
  const res = await cache.match(VERSION_KEY);
  return res ? await res.text() : null;
}
async function setCachedVersion(cache, version) {
  await cache.put(VERSION_KEY, new Response(version));
}

async function fetchManifest() {
  const cache = await caches.open(CONTENT_CACHE);
  try {
    const res = await fetch(`${MANIFEST_URL}?t=${Date.now()}`, { cache: "no-store" });
    if (!res.ok) throw new Error("network response not ok");
    return { manifest: await res.clone().json(), fromNetwork: true };
  } catch (e) {
    const cached = await cache.match(MANIFEST_URL);
    if (cached) return { manifest: await cached.json(), fromNetwork: false };
    return null;
  }
}

async function syncContent() {
  setSyncBadge("確認中…");
  const cache = await caches.open(CONTENT_CACHE);
  const result = await fetchManifest();
  if (!result) { setSyncBadge("オフライン(前回データ表示中)"); return; }

  const { manifest, fromNetwork } = result;
  const localVersion = await getCachedVersion(cache);

  if (!fromNetwork) {
    renderGrid(manifest);
    setupScreensaver(manifest);
    setSyncBadge("オフライン(前回データ表示中)");
    return;
  }

  if (localVersion === manifest.version) {
    renderGrid(manifest);
    setupScreensaver(manifest);
    setSyncBadge("最新の状態です");
    return;
  }

  setSyncBadge("更新をダウンロード中…");
  try {
    const mediaUrls = (manifest.items || []).map((it) => it.media).filter(Boolean);
    if (manifest.screensaver) mediaUrls.push(manifest.screensaver);

    for (const mediaPath of mediaUrls) {
      const already = await cache.match(mediaPath);
      if (already) continue;
      try {
        const fileRes = await fetch(mediaPath);
        if (fileRes.ok) await cache.put(mediaPath, fileRes.clone());
      } catch (e) { /* 個別ファイル取得失敗は無視し、次回再試行に任せる */ }
    }
    await cache.put(MANIFEST_URL, new Response(JSON.stringify(manifest)));
    await setCachedVersion(cache, manifest.version);
    renderGrid(manifest);
    setupScreensaver(manifest);
    setSyncBadge("更新完了");
  } catch (e) {
    setSyncBadge("更新に失敗(次回再試行)");
    const cachedManifest = await cache.match(MANIFEST_URL);
    if (cachedManifest) {
      const m = await cachedManifest.json();
      renderGrid(m);
      setupScreensaver(m);
    }
  }
}

function setSyncBadge(text){ document.getElementById("syncBadge").textContent = text; }

async function resolveMediaUrl(path){
  if (!path) return null;
  const cache = await caches.open(CONTENT_CACHE);
  const cached = await cache.match(path);
  if (cached) return URL.createObjectURL(await cached.blob());
  return path;
}

// スクリーンセーバー動画をmanifest.jsonの内容に合わせて設定する
async function setupScreensaver(manifest){
  const video = document.getElementById('screensaverVideo');
  if (!manifest.screensaver) return;
  const url = await resolveMediaUrl(manifest.screensaver).catch(() => manifest.screensaver);
  if (url && video.dataset.loadedSrc !== manifest.screensaver) {
    video.src = url;
    video.dataset.loadedSrc = manifest.screensaver; // 同じ動画の再読み込みを避ける
  }
}

function bySlot(items){
  const map = {};
  for (const it of (items || [])) {
    const slot = Number(it.slot);
    if (slot >= 1 && slot <= SLOT_COUNT) map[slot] = it;
  }
  return map;
}

function isFrameTooDark(ctx, width, height){
  try {
    const { data } = ctx.getImageData(0, 0, width, height);
    let total = 0;
    const sampleStep = 40 * 4;
    let count = 0;
    for (let i = 0; i < data.length; i += sampleStep) {
      total += (data[i] + data[i + 1] + data[i + 2]) / 3;
      count++;
    }
    const avgBrightness = count ? total / count : 0;
    return avgBrightness < 12;
  } catch (e) {
    return false;
  }
}

function captureVideoFrame(url){
  return new Promise((resolve) => {
    const v = document.createElement('video');
    v.src = url;
    v.muted = true;
    v.playsInline = true;
    v.preload = 'auto';
    v.crossOrigin = 'anonymous';
    let done = false;
    let attemptIndex = 0;
    const finish = (result) => { if (!done) { done = true; resolve(result); } };

    const seekOffsets = (duration) => {
      const d = duration && isFinite(duration) && duration > 0 ? duration : 4;
      return [0.3, Math.min(1.5, d * 0.15), Math.min(3, d * 0.3), Math.min(5, d * 0.5)];
    };

    let offsets = null;
    let bestResult = null;

    const tryNextOffset = () => {
      if (!offsets || attemptIndex >= offsets.length) {
        finish(bestResult);
        return;
      }
      try { v.currentTime = offsets[attemptIndex]; }
      catch (e) { finish(bestResult); }
    };

    v.addEventListener('loadeddata', () => {
      offsets = seekOffsets(v.duration);
      tryNextOffset();
    });

    v.addEventListener('seeked', () => {
      try {
        const canvas = document.createElement('canvas');
        canvas.width = v.videoWidth || 320;
        canvas.height = v.videoHeight || 180;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(v, 0, 0, canvas.width, canvas.height);
        const dataUrl = canvas.toDataURL('image/jpeg', 0.8);
        bestResult = dataUrl;

        if (!isFrameTooDark(ctx, canvas.width, canvas.height)) {
          finish(dataUrl);
          return;
        }
        attemptIndex++;
        tryNextOffset();
      } catch (e) { finish(bestResult); }
    });

    v.addEventListener('error', () => finish(null));
    setTimeout(() => finish(bestResult), 8000);
    v.load();
  });
}

// すでにローカルへ同期済み(キャッシュ済み)のPDFであれば、そのデータを
// そのまま使う(ネット速度に一切左右されず瞬時に開ける)。
// まだ同期が済んでいない(アップロード直後など)場合のみ、
// ネット経由の範囲リクエストにフォールバックする。
async function getPdfSource(path){
  try {
    const cache = await caches.open(CONTENT_CACHE);
    const cached = await cache.match(path);
    if (cached) {
      const buf = await cached.arrayBuffer();
      return { data: new Uint8Array(buf) }; // ローカルデータなので即座に開ける
    }
  } catch (e) { /* キャッシュ参照に失敗した場合はネット経由にフォールバック */ }
  return { url: path }; // 未同期の場合のみ、範囲リクエストで少しずつ取得
}

// PDFの1ページ目を静止画(dataURL)としてキャプチャする(タイルのサムネイル用)。
async function renderPdfThumbnail(url){
  if (!window.pdfjsLib) return null;
  let pdf = null;
  try {
    const src = await getPdfSource(url);
    pdf = await pdfjsLib.getDocument(src).promise;
    const page = await pdf.getPage(1);
    const viewport = page.getViewport({ scale: 0.6 });
    const canvas = document.createElement('canvas');
    canvas.width = viewport.width;
    canvas.height = viewport.height;
    const ctx = canvas.getContext('2d');
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    await page.render({ canvasContext: ctx, viewport }).promise;
    return canvas.toDataURL('image/jpeg', 0.85);
  } catch (e) {
    return null;
  } finally {
    if (pdf) pdf.destroy();
  }
}

let pdfThumbnailQueue = Promise.resolve();
function queuePdfThumbnail(url, tile){
  pdfThumbnailQueue = pdfThumbnailQueue
    .then(() => renderPdfThumbnail(url))
    .then((dataUrl) => {
      if (!dataUrl) {
        console.warn('PDFサムネイルの生成に失敗しました:', url);
        return;
      }
      const mediaDiv = tile.querySelector('.tile-media');
      if (mediaDiv) {
        mediaDiv.innerHTML = '';
        const img = document.createElement('img');
        img.src = dataUrl;
        img.style.objectFit = 'contain';
        img.style.background = '#fff';
        mediaDiv.appendChild(img);
      }
    })
    .catch((e) => console.warn('PDFサムネイル処理エラー:', e));
}

// PDFの全ページを縦スクロールで表示する。すでにローカルへ同期済みなら
// そのデータを直接使い(ネット速度に左右されず瞬時に表示)、
// 未同期の場合のみ範囲リクエスト(Range)で少しずつ取得しながら表示する。
async function renderPdfInto(container, url){
  container.innerHTML = `<div style="color:#8FA0B3;font-size:18px;" id="pdfLoadingMsg">PDFを読み込んでいます…</div>`;
  if (!window.pdfjsLib) {
    container.innerHTML = `<div style="color:#8FA0B3;font-size:18px;">PDFを表示できませんでした</div>`;
    return;
  }
  let pdf = null;
  try {
    const src = await getPdfSource(url);
    const loadingTask = pdfjsLib.getDocument(src);
    loadingTask.onProgress = (progress) => {
      const msgEl = document.getElementById('pdfLoadingMsg');
      if (msgEl && progress.total) {
        const pct = Math.min(100, Math.round((progress.loaded / progress.total) * 100));
        msgEl.textContent = `PDFを読み込んでいます…(${pct}%)`;
      }
    };
    pdf = await loadingTask.promise;

    container.innerHTML = '';
    container.style.overflowY = 'auto';
    container.style.background = '#3a3f45';
    container.style.padding = '16px';

    const availableWidth = Math.max(320, container.clientWidth - 32);
    const firstPage = await pdf.getPage(1);
    const naturalViewport = firstPage.getViewport({ scale: 1 });
    const fitScale = Math.min(2.0, Math.max(0.8, availableWidth / naturalViewport.width));

    const renderPage = async (page) => {
      const viewport = page.getViewport({ scale: fitScale });
      const canvas = document.createElement('canvas');
      canvas.width = viewport.width;
      canvas.height = viewport.height;
      canvas.style.display = 'block';
      canvas.style.margin = '0 auto 16px';
      canvas.style.background = '#fff';
      canvas.style.maxWidth = '100%';
      canvas.style.height = 'auto';
      const ctx = canvas.getContext('2d');
      container.appendChild(canvas);
      await page.render({ canvasContext: ctx, viewport }).promise;
    };

    for (let n = 1; n <= pdf.numPages; n++) {
      const page = await pdf.getPage(n);
      await renderPage(page);
    }

    if (pdf.numPages > 1) {
      showPdfScrollHint(container);
    }
  } catch (e) {
    console.error('PDF表示エラー:', e);
    container.innerHTML = `<div style="color:#8FA0B3;font-size:18px;">PDFの表示に失敗しました(${e && e.message ? e.message : e})</div>`;
  } finally {
    if (pdf) pdf.destroy();
  }
}

function showPdfScrollHint(scrollContainer){
  const viewerView = document.getElementById('viewer-view');
  const hint = document.createElement('div');
  hint.className = 'scroll-hint';
  hint.id = 'pdfScrollHint';
  hint.innerHTML = `<div class="arrow"></div><span>下にスクロールできます</span>`;
  viewerView.appendChild(hint);

  let removed = false;
  const remove = () => {
    if (removed) return;
    removed = true;
    hint.classList.add('hide');
    setTimeout(() => hint.remove(), 700);
  };

  scrollContainer.addEventListener('scroll', remove, { once: true, passive: true });
  setTimeout(remove, 5000);
}

async function renderGrid(manifest){
  const gridWrap = document.getElementById('gridWrap');
  gridWrap.innerHTML = "";
  const slotted = bySlot(manifest.items);

  for (let slot = 1; slot <= SLOT_COUNT; slot++) {
    const it = slotted[slot];
    const tile = document.createElement('div');

    if (!it) {
      tile.className = 'tile empty';
      tile.textContent = "未設定";
      gridWrap.appendChild(tile);
      continue;
    }

    tile.className = 'tile';
    const mediaUrl = await resolveMediaUrl(it.media).catch(() => it.media);

    let mediaHtml;
    if (it.type === 'pdf') {
      mediaHtml = `<span class="fallback-icon">📄</span>`;
    } else if (it.type === 'video') {
      mediaHtml = `<span class="fallback-icon">🎬</span>`;
    } else if (mediaUrl) {
      mediaHtml = `<img src="${mediaUrl}" alt="" onerror="this.replaceWith(Object.assign(document.createElement('span'),{className:'fallback-icon',textContent:'🖼️'}))">`;
    } else {
      mediaHtml = `<span class="fallback-icon">🖼️</span>`;
    }

    tile.innerHTML = `
      <div class="tile-tag">${it.tag || (it.type === 'video' ? '動画' : it.type === 'pdf' ? 'PDF' : '写真')}</div>
      <div class="tile-media">${mediaHtml}</div>
      <div class="tile-label">${it.label || ''}</div>
    `;
    tile.addEventListener('click', () => openViewer(it));
    gridWrap.appendChild(tile);

    if (it.type === 'video' && mediaUrl) {
      captureVideoFrame(mediaUrl).then((dataUrl) => {
        if (!dataUrl) return;
        const mediaDiv = tile.querySelector('.tile-media');
        if (mediaDiv) {
          mediaDiv.innerHTML = '';
          const img = document.createElement('img');
          img.src = dataUrl;
          mediaDiv.appendChild(img);
        }
      });
    }

    if (it.type === 'pdf') {
      // it.media(元のURL)を渡す。関数内部でローカルキャッシュの有無を
      // 判定し、あればそちらを、なければ範囲リクエストを使う。
      queuePdfThumbnail(it.media, tile);
    }
  }

  const quizTile = document.createElement('div');
  quizTile.className = 'tile quiz-tile';
  quizTile.innerHTML = `
    <div class="tile-tag">クイズ</div>
    <div class="tile-media"><img src="assets/quiz-icon.png" alt="クイズ" style="object-fit:contain;padding:14px;background:#fff;" onerror="this.replaceWith(Object.assign(document.createElement('span'),{className:'fallback-icon',textContent:'🧩'}))"></div>
    <div class="tile-label">日本国土開発クイズに挑戦!</div>
  `;
  quizTile.addEventListener('click', openQuiz);
  gridWrap.appendChild(quizTile);
}

async function openViewer(it){
  document.getElementById('grid-view').style.display = 'none';
  document.getElementById('viewerTitle').textContent = it.label || '';
  const stage = document.getElementById('viewerStage');

  if (it.type === 'pdf') {
    stage.innerHTML = '';
    stage.style.display = 'block';
    // it.media(元のURL)を渡す。関数内部でローカルキャッシュの有無を
    // 判定し、あればそちらを、なければ範囲リクエストを使う。
    await renderPdfInto(stage, it.media);
  } else {
    const mediaUrl = await resolveMediaUrl(it.media).catch(() => it.media);
    if (mediaUrl && it.type === 'video') {
      stage.style.display = '';
      stage.innerHTML = `<video src="${mediaUrl}" autoplay loop playsinline></video>`;
    } else if (mediaUrl && it.type === 'image') {
      stage.style.display = '';
      stage.innerHTML = `<img src="${mediaUrl}" alt="${it.label || ''}">`;
    } else {
      stage.style.display = '';
      stage.innerHTML = `<div>コンテンツを取得できませんでした</div>`;
    }
  }
  document.getElementById('viewer-view').classList.add('active');
}

document.getElementById('backBtn').addEventListener('click', () => {
  const stage = document.getElementById('viewerStage');
  const video = stage.querySelector('video');
  if (video) { video.pause(); }
  document.getElementById('viewer-view').classList.remove('active');
  stage.innerHTML = "";
  stage.style.overflowY = '';
  const leftoverHint = document.getElementById('pdfScrollHint');
  if (leftoverHint) leftoverHint.remove();
  document.getElementById('grid-view').style.display = 'flex';
});

function tick(){
  const now = new Date();
  const pad = n => String(n).padStart(2,'0');
  document.getElementById('clock').textContent =
    `${now.getFullYear()}/${pad(now.getMonth()+1)}/${pad(now.getDate())} ${pad(now.getHours())}:${pad(now.getMinutes())}`;
}
tick();
setInterval(tick, 1000 * 30);

/* =========================================================
   日本国土開発クイズ
   ========================================================= */

const QUIZ_SOUNDS = {
  start: new Audio('sounds/start.mp3'),
  correct: new Audio('sounds/correct.mp3'),
  wrong: new Audio('sounds/wrong.mp3'),
  perfect: new Audio('sounds/perfect.mp3'),
  other_result: new Audio('sounds/other_result.mp3'),
};
Object.values(QUIZ_SOUNDS).forEach((a) => { a.preload = 'auto'; });

function playQuizSound(key){
  const audio = QUIZ_SOUNDS[key];
  if (!audio) return;
  try {
    audio.pause();
    audio.currentTime = 0;
    audio.play().catch(() => {});
  } catch (e) {}
}

const QUIZ_QUESTIONS = [
  {
    emoji: "🏚️",
    q: "日本国土開発が生まれたのは、どんな時代?",
    choices: [
      "🏚️ 戦争が終わって、国をもう一度立て直そうとしていた時代",
      "🦖 恐竜がいた大昔",
      "🏯 お城がたくさん建てられていた江戸時代",
      "🚀 まだだれも生まれていない未来"
    ],
    correct: 0,
    explain: "1951年、戦争で荒れてしまった国を元気にするために生まれた会社なんだ。"
  },
  {
    emoji: "🚜",
    q: "工事の現場で活躍する、大きな力持ちの乗り物といえば?",
    choices: [
      "🚀 ロケット",
      "🚜 ブルドーザーなどの重機",
      "🚁 荷物を運ぶヘリコプター",
      "🛥️ 海を進む潜水艦"
    ],
    correct: 1,
    explain: "日本国土開発は、いち早くブルドーザーなどの重機を取り入れて工事をしてきたよ。"
  },
  {
    emoji: "🤝",
    q: "大きな地震で困っている街があったとき、日本国土開発は何をした?",
    choices: [
      "👀 何もせず様子を見ていた",
      "📷 写真だけ撮ってすぐ帰った",
      "🤝 力を合わせて復興のお手伝いをした",
      "🚚 街から遠くへ引っ越した"
    ],
    correct: 2,
    explain: "東日本大震災のときも、いち早く駆けつけて復興を支えたんだ。"
  },
  {
    emoji: "☀️",
    q: "太陽の光を電気に変える発電所も作っているよ。その発電方法は?",
    choices: [
      "☀️ 太陽光発電",

    ],

  },
  {

    q: "日本国土開発が作っているものはどれ?",
    choices: [
      "🍰 お菓子や洋服",
      "🌉 トンネルや橋、道路などの街の土台",
      "✈️ 飛行機そのもの",
      "🎮 テレビゲーム"
    ],
    correct: 1,
    explain: "みんなが安心して暮らせるように、道路・橋・トンネルなど、街の土台を作っているよ。"
  }
];

let quizIndex = 0;
let quizScore = 0;

function openQuiz(){
  quizIndex = 0;
  quizScore = 0;
  document.getElementById('grid-view').style.display = 'none';
  document.getElementById('quiz-view').classList.add('active');
  renderQuizQuestion();
}

function closeQuiz(){
  document.getElementById('quiz-view').classList.remove('active');
  document.getElementById('grid-view').style.display = 'flex';
}

function renderQuizQuestion(){
  const body = document.getElementById('quizBody');
  if (quizIndex >= QUIZ_QUESTIONS.length) {
    renderQuizResult();
    return;
  }
  const q = QUIZ_QUESTIONS[quizIndex];
  playQuizSound('start');
  body.innerHTML = `
    <div class="quiz-progress">問題 ${quizIndex + 1} / ${QUIZ_QUESTIONS.length}</div>
    <div class="quiz-question-emoji">${q.emoji}</div>
    <div class="quiz-question">${q.q}</div>
    <div class="quiz-choices" id="quizChoices"></div>
    <div class="quiz-feedback" id="quizFeedback" style="display:none;"></div>
    <div class="quiz-explain" id="quizExplain" style="display:none;"></div>
    <button class="quiz-next" id="quizNextBtn" style="display:none;">次へ</button>
  `;
  const choicesWrap = document.getElementById('quizChoices');
  q.choices.forEach((choiceText, i) => {
    const btn = document.createElement('div');
    btn.className = 'quiz-choice';
    btn.textContent = choiceText;
    btn.addEventListener('click', () => selectQuizAnswer(i));
    choicesWrap.appendChild(btn);
  });
}

function selectQuizAnswer(selectedIndex){
  const q = QUIZ_QUESTIONS[quizIndex];
  const isCorrect = selectedIndex === q.correct;
  const buttons = document.querySelectorAll('#quizChoices .quiz-choice');
  buttons.forEach((b, i) => {
    b.style.pointerEvents = 'none';
    if (i === q.correct) b.classList.add('correct');
    else if (i === selectedIndex) b.classList.add('wrong');
  });
  if (isCorrect) quizScore++;
  playQuizSound(isCorrect ? 'correct' : 'wrong');

  const feedbackEl = document.getElementById('quizFeedback');
  feedbackEl.textContent = isCorrect ? "🎉 せいかい!" : "😢 ざんねん、ちがうよ";
  feedbackEl.className = "quiz-feedback " + (isCorrect ? "correct-text" : "wrong-text");
  feedbackEl.style.display = 'block';

  const explainEl = document.getElementById('quizExplain');
  explainEl.textContent = q.explain;
  explainEl.style.display = 'block';

  const nextBtn = document.getElementById('quizNextBtn');
  nextBtn.style.display = 'inline-block';
  nextBtn.textContent = (quizIndex === QUIZ_QUESTIONS.length - 1) ? "結果を見る" : "次へ";
  nextBtn.onclick = () => { quizIndex++; renderQuizQuestion(); };
}

function renderQuizResult(){
  const body = document.getElementById('quizBody');
  const total = QUIZ_QUESTIONS.length;
  let emoji = "🌱";
  let msg = "また挑戦してね!";
  if (quizScore === total) { emoji = "🏆"; msg = "パーフェクト!日本国土開発博士だね!"; playQuizSound('perfect'); }
  else { playQuizSound('other_result'); if (quizScore >= Math.ceil(total * 0.6)) { emoji = "🎉"; msg = "よくできました!"; } }

  body.innerHTML = `
    <div class="quiz-result-emoji">${emoji}</div>
    <div class="quiz-result-text">${quizScore} / ${total} 問正解!</div>
    <div class="quiz-result-sub">${msg}<br>日本国土開発は、みんなの街を元気にするお仕事をしています。</div>
    <button class="quiz-next" id="quizRetryBtn">もう一度挑戦する</button>
  `;
  document.getElementById('quizRetryBtn').addEventListener('click', openQuiz);
}

document.getElementById('quizBackBtn').addEventListener('click', closeQuiz);

/* =========================================================
   スクリーンセーバー(10分間操作がなければ表示)
   ========================================================= */

const IDLE_TIMEOUT_MS = 10 * 60 * 1000;
let idleTimer = null;

function showScreensaver(){
  const video = document.querySelector('#viewerStage video');
  if (video) video.pause();
  document.getElementById('viewer-view').classList.remove('active');
  document.getElementById('viewerStage').innerHTML = '';
  document.getElementById('quiz-view').classList.remove('active');
  document.getElementById('grid-view').style.display = 'flex';
  const leftoverHint = document.getElementById('pdfScrollHint');
  if (leftoverHint) leftoverHint.remove();

  document.getElementById('screensaver-view').classList.add('active');
  const ssVideo = document.getElementById('screensaverVideo');
  if (ssVideo.src) {
    ssVideo.currentTime = 0;
    ssVideo.play().catch(() => {});
  }
}

function hideScreensaver(){
  document.getElementById('screensaver-view').classList.remove('active');
  document.getElementById('screensaverVideo').pause();
}

function resetIdleTimer(){
  if (idleTimer) clearTimeout(idleTimer);
  idleTimer = setTimeout(showScreensaver, IDLE_TIMEOUT_MS);
}

['touchstart', 'mousedown', 'click', 'keydown'].forEach((evt) => {
  document.addEventListener(evt, () => {
    const wasShowingScreensaver = document.getElementById('screensaver-view').classList.contains('active');
    if (wasShowingScreensaver) {
      hideScreensaver();
    }
    resetIdleTimer();
  }, { passive: true });
});

resetIdleTimer();

syncContent();
setInterval(syncContent, SYNC_INTERVAL_MS);
</script>
