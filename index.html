<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>工事案内タッチサイネージ</title>
<style>
  :root { --bg:#1b2430; --panel:#26313f; --panel-hi:#2f3d4d; --accent:#f5a623; --text:#f2f0ea; --dim:#8fa0b3; --alert:#ff6b35; }
  * { box-sizing:border-box; }
  html, body { width:100%; height:100%; margin:0; overflow:hidden; background:var(--bg); color:var(--text); font-family:"Noto Sans JP","Yu Gothic",sans-serif; -webkit-user-select:none; user-select:none; }
  #app { width:100vw; height:100vh; position:relative; }
  #grid-view { height:100%; display:flex; flex-direction:column; }
  .stripe { height:14px; flex:0 0 auto; background:repeating-linear-gradient(135deg,var(--accent) 0 18px,var(--bg) 18px 36px); }
  header { flex:0 0 auto; padding:22px 36px 14px; }
  .eyebrow { color:var(--accent); font-size:14px; font-weight:700; letter-spacing:.12em; }
  h1 { margin:5px 0 0; font-size:31px; line-height:1.2; }
  .sub { margin-top:6px; color:var(--dim); font-size:15px; }

  /* 1920 x 1080: seven current cards fit in a 4 x 2 grid without scrolling. */
  #grid { flex:1 1 auto; min-height:0; padding:8px 32px 20px; display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); grid-template-rows:repeat(2,minmax(0,1fr)); gap:18px; overflow:hidden; }
  .tile { min-height:0; position:relative; overflow:hidden; border:2px solid transparent; border-radius:18px; background:var(--panel); cursor:pointer; transition:transform .12s ease,border-color .12s ease; }
  .tile:active { transform:scale(.975); border-color:var(--accent); }
  .tile-media { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; background:#1d2834; }
  .tile-media img { width:100%; height:100%; object-fit:cover; opacity:.88; }
  .tile-fallback { font-size:64px; opacity:.55; }
  .tile-label { position:absolute; inset:auto 0 0; padding:34px 16px 15px; font-size:18px; font-weight:700; background:linear-gradient(transparent,rgba(0,0,0,.82)); }
  .tile-tag { position:absolute; z-index:1; top:12px; left:12px; border-radius:999px; padding:4px 9px; background:var(--accent); color:#20242b; font-size:12px; font-weight:800; }
  footer { flex:0 0 auto; height:48px; padding:0 36px; display:flex; align-items:center; justify-content:space-between; border-top:1px solid rgba(255,255,255,.1); color:var(--dim); font-size:13px; }
  .dot { display:inline-block; width:9px; height:9px; margin-right:7px; border-radius:50%; background:var(--alert); }
  #sync { margin-left:8px; border-radius:999px; padding:3px 8px; background:var(--panel-hi); }

  #viewer { position:absolute; inset:0; display:none; flex-direction:column; background:#000; }
  #viewer.active { display:flex; }
  #stage { flex:1; min-height:0; display:flex; justify-content:center; align-items:center; }
  #stage img, #stage video { max-width:100%; max-height:100%; }
  #viewer-bar { flex:0 0 auto; display:flex; align-items:center; justify-content:space-between; padding:16px 28px; background:var(--panel); }
  #back { border:0; border-radius:12px; padding:13px 22px; background:var(--panel-hi); color:var(--text); font-size:17px; font-weight:700; }
  #title { color:var(--dim); font-weight:700; }
  @media (max-width:1200px) { #grid { grid-template-columns:repeat(3,minmax(0,1fr)); grid-template-rows:repeat(3,minmax(0,1fr)); } h1 { font-size:25px; } }
</style>
</head>
<body>
<main id="app">
  <section id="grid-view">
    <div class="stripe"></div>
    <header><div class="eyebrow">工事のお知らせ / SITE INFORMATION</div><h1>ご覧になりたい項目をタップしてください</h1><div class="sub">工事の進捗状況や周辺への影響について、写真・動画でご案内しています</div></header>
    <div id="grid"></div>
    <footer><div><span class="dot"></span>コンテンツは定期的に更新されます<span id="sync">確認中…</span></div><div id="clock"></div></footer>
  </section>
  <section id="viewer"><div id="stage"></div><div id="viewer-bar"><button id="back">← 一覧に戻る</button><div id="title"></div></div></section>
</main>
<script>
const MANIFEST_URL = "manifest.json";
const CONTENT_CACHE = "signage-content-v2";
const VERSION_KEY = new Request("https://signage.internal/content-version-v2");
const SYNC_INTERVAL_MS = 10 * 60 * 1000;
let currentObjectUrl = null;

if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js?v=2").catch(() => {});

function setSync(text) { document.getElementById("sync").textContent = text; }
async function getVersion(cache) { const r = await cache.match(VERSION_KEY); return r ? r.text() : null; }
async function putVersion(cache, version) { await cache.put(VERSION_KEY, new Response(version)); }

async function getManifest(cache) {
  try {
    const response = await fetch(MANIFEST_URL, { cache:"no-store" });
    if (!response.ok) throw new Error("manifest fetch failed");
    return { manifest:await response.clone().json(), response, online:true };
  } catch {
    const cached = await cache.match(MANIFEST_URL);
    return cached ? { manifest:await cached.json(), response:null, online:false } : null;
  }
}

async function sync() {
  setSync("確認中…");
  const cache = await caches.open(CONTENT_CACHE);
  const result = await getManifest(cache);
  if (!result) { setSync("オフライン"); return; }
  const { manifest, online } = result;
  const localVersion = await getVersion(cache);
  if (!online) { render(manifest); setSync("オフライン（前回データ）"); return; }
  if (localVersion === manifest.version) { render(manifest); setSync("最新の状態です"); return; }
  setSync("更新をダウンロード中…");
  try {
    for (const item of manifest.items || []) {
      for (const url of new Set([item.icon, item.media].filter(Boolean))) {
        if (await cache.match(url)) continue;
        const response = await fetch(url);
        if (!response.ok) throw new Error("media fetch failed");
        await cache.put(url, response.clone());
      }
    }
    await cache.put(MANIFEST_URL, new Response(JSON.stringify(manifest)));
    await putVersion(cache, manifest.version);
    render(manifest); setSync("更新完了");
  } catch (error) {
    const old = await cache.match(MANIFEST_URL);
    if (old) render(await old.json());
    setSync("更新に失敗（次回再試行）");
  }
}

async function cachedUrl(url) {
  const response = await (await caches.open(CONTENT_CACHE)).match(url);
  return response ? URL.createObjectURL(await response.blob()) : url;
}
function isVideo(url) { return /\.(mp4|webm|mov)(\?|$)/i.test(url || ""); }
async function render(manifest) {
  const grid = document.getElementById("grid"); grid.replaceChildren();
  for (const item of manifest.items || []) {
    const tile = document.createElement("button"); tile.className = "tile"; tile.type = "button";
    const tag = document.createElement("span"); tag.className = "tile-tag"; tag.textContent = item.tag || (item.type === "video" ? "動画" : "写真");
    const media = document.createElement("div"); media.className = "tile-media";
    if (item.icon && !isVideo(item.icon)) { const image = new Image(); image.src = await cachedUrl(item.icon); image.alt = ""; media.append(image); }
    else { const fallback = document.createElement("span"); fallback.className = "tile-fallback"; fallback.textContent = item.type === "video" ? "🎬" : "🖼️"; media.append(fallback); }
    const label = document.createElement("div"); label.className = "tile-label"; label.textContent = item.label || "名称未設定";
    tile.append(tag, media, label); tile.addEventListener("click", () => openViewer(item)); grid.append(tile);
  }
}
async function openViewer(item) {
  const url = await cachedUrl(item.media);
  const stage = document.getElementById("stage"); stage.replaceChildren();
  if (currentObjectUrl) URL.revokeObjectURL(currentObjectUrl);
  currentObjectUrl = url.startsWith("blob:") ? url : null;
  const node = document.createElement(item.type === "video" ? "video" : "img"); node.src = url;
  if (item.type === "video") { node.controls = true; node.autoplay = true; node.playsInline = true; }
  else node.alt = item.label || "";
  stage.append(node); document.getElementById("title").textContent = item.label || ""; document.getElementById("viewer").classList.add("active");
}
document.getElementById("back").addEventListener("click", () => { document.getElementById("viewer").classList.remove("active"); document.getElementById("stage").replaceChildren(); });
function clock() { const d = new Date(), p = n => String(n).padStart(2,"0"); document.getElementById("clock").textContent = `${d.getFullYear()}/${p(d.getMonth()+1)}/${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`; }
clock(); setInterval(clock, 30000); sync(); setInterval(sync, SYNC_INTERVAL_MS);
</script>
</body>
</html>
