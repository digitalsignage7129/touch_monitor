<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>コンテンツ管理 - アップロード</title>
<style>
  :root{
    --bg:#1B2430; --panel:#26313F; --accent:#F5A623; --text:#F2F0EA; --text-dim:#8FA0B3;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; min-height:100vh; background:var(--bg); color:var(--text);
    font-family:"Zen Kaku Gothic New","Noto Sans JP",sans-serif;
    display:flex; align-items:center; justify-content:center; padding:24px;
  }
  .card{
    background:var(--panel); border-radius:20px; padding:36px;
    width:100%; max-width:480px; margin-bottom:24px;
  }
  h1{ font-size:22px; margin-bottom:6px; }
  h2{ font-size:18px; margin-bottom:6px; }
  .sub{ color:var(--text-dim); font-size:14px; margin-bottom:24px; }
  label{ display:block; font-size:14px; margin:16px 0 6px; color:var(--text-dim); }
  input[type=text], input[type=password], select{
    width:100%; padding:12px 14px; border-radius:10px; border:none;
    background:#1E2733; color:var(--text); font-size:15px;
  }
  input[type=file]{ width:100%; margin-top:4px; color:var(--text-dim); }
  .slot-grid{
    display:grid; grid-template-columns: repeat(3, 1fr); gap:8px; margin-top:6px;
  }
  .slot-opt{
    padding:10px 0; text-align:center; border-radius:10px; background:#1E2733;
    cursor:pointer; font-size:14px; border:2px solid transparent;
  }
  .slot-opt.selected{ border-color:var(--accent); background:#2A3644; color:var(--accent); font-weight:700; }
  .hint{ font-size:12px; color:var(--text-dim); margin-top:6px; }
  button{
    width:100%; margin-top:26px; padding:14px; border:none; border-radius:12px;
    background:var(--accent); color:#20242b; font-size:16px; font-weight:700; cursor:pointer;
  }
  button:disabled{ opacity:0.5; cursor:not-allowed; }
  .status{ margin-top:16px; font-size:14px; text-align:center; min-height:20px; }
  .status.ok{ color:#7CD98A; }
  .status.err{ color:#FF6B6B; }
  .divider-label{ text-align:center; color:var(--text-dim); font-size:13px; margin:8px 0 20px; }
</style>
</head>
<body>
<div>

  <div class="card">
    <h1>コンテンツのアップロード</h1>
    <div class="sub">現場モニターに表示する画像・動画を追加できます</div>

    <label>パスワード</label>
    <input type="password" id="password" placeholder="担当者から共有されたパスワード">

    <label>表示名(モニター画面に表示される名称)</label>
    <input type="text" id="label" placeholder="例:工事の進め方について">

    <label>種別</label>
    <select id="type">
      <option value="image">写真</option>
      <option value="video">動画</option>
      <option value="gallery">画像アルバム(複数枚)</option>
      <option value="html">HTMLページ(自作コンテンツ)</option>
    </select>

    <label>配置スロット(1〜5のどこに表示するか。6枠目は固定のクイズです)</label>
    <div class="slot-grid" id="slotGrid"></div>
    <div class="hint">既に使われているスロットを選ぶと、その位置の内容だけが置き換わります</div>

    <label>ファイル(画像アルバムを選んだ場合は複数枚選択できます)</label>
    <input type="file" id="file" accept="image/*,video/*,.html,.htm,text/html" multiple>
    <div class="hint" id="fileCountHint"></div>

    <div id="htmlIconRow" style="display:none;">
      <label>タイルのアイコン画像(省略可。指定しない場合は🌐マークになります)</label>
      <input type="file" id="htmlIconFile" accept="image/*">
    </div>

    <button id="submitBtn">アップロードする</button>
    <div class="status" id="status"></div>
  </div>

  <div class="card">
    <h2>スクリーンセーバー動画の変更</h2>
    <div class="sub">10分間操作がないときに表示される動画です。現在の動画を上書きします。</div>

    <label>パスワード</label>
    <input type="password" id="ssPassword" placeholder="担当者から共有されたパスワード">

    <label>動画ファイル</label>
    <input type="file" id="ssFile" accept="video/*">

    <button id="ssSubmitBtn">スクリーンセーバーを更新する</button>
    <div class="status" id="ssStatus"></div>
  </div>

</div>

<script>
  // ↓ 実際にデプロイしたCloudflare WorkersのURLに書き換えてください
  const WORKER_URL = "https://little-voice-be13.test-digital-signage-test.workers.dev";

  // ---- 通常コンテンツのアップロード ----
  let selectedSlot = null;
  const slotGrid = document.getElementById("slotGrid");
  for (let i = 1; i <= 5; i++) {
    const el = document.createElement("div");
    el.className = "slot-opt";
    el.textContent = `枠 ${i}`;
    el.addEventListener("click", () => {
      selectedSlot = i;
      document.querySelectorAll(".slot-opt").forEach(n => n.classList.remove("selected"));
      el.classList.add("selected");
    });
    slotGrid.appendChild(el);
  }

  const submitBtn = document.getElementById("submitBtn");
  const statusEl = document.getElementById("status");

  document.getElementById("file").addEventListener("change", (e) => {
    const count = e.target.files.length;
    document.getElementById("fileCountHint").textContent =
      count > 1 ? `${count}枚を選択中(画像アルバムとしてまとめてアップロードされます)` : "";
  });

  document.getElementById("type").addEventListener("change", (e) => {
    document.getElementById("htmlIconRow").style.display = (e.target.value === "html") ? "block" : "none";
  });

  submitBtn.addEventListener("click", async () => {
    const password = document.getElementById("password").value;
    const label = document.getElementById("label").value.trim();
    const type = document.getElementById("type").value;
    const fileInput = document.getElementById("file");
    const files = Array.from(fileInput.files || []);

    if (!password || !label || files.length === 0 || !selectedSlot) {
      setStatus(statusEl, "パスワード・表示名・配置スロット・ファイルをすべて入力してください", "err");
      return;
    }

    submitBtn.disabled = true;

    try {
      if (type === "gallery") {
        // 画像アルバム:1枚ずつアップロードしてURLを集め、最後にまとめて確定する
        const urls = [];
        for (let i = 0; i < files.length; i++) {
          const file = files[i];
          setStatus(statusEl, `アップロード中… (${i + 1}/${files.length}枚目)`, "");
          const res = await fetch(WORKER_URL, {
            method: "POST",
            headers: {
              "Content-Type": file.type || "application/octet-stream",
              "X-Upload-Password": encodeURIComponent(password),
              "X-Media-Type": "gallery-image",
              "X-File-Name": encodeURIComponent(file.name),
            },
            body: file,
          });
          const data = await res.json();
          if (!data.ok) throw new Error(data.error || `${i + 1}枚目のアップロードに失敗しました`);
          urls.push(data.url);
        }

        setStatus(statusEl, "内容を確定しています…", "");
        const commitRes = await fetch(WORKER_URL, {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "X-Upload-Password": encodeURIComponent(password),
            "X-Media-Type": "gallery-commit",
          },
          body: JSON.stringify({ label, slot: selectedSlot, urls }),
        });
        const commitData = await commitRes.json();
        if (!commitData.ok) throw new Error(commitData.error || "確定処理に失敗しました");

        setStatus(statusEl, `アップロードが完了しました(全${urls.length}枚)。数分後にモニターへ反映されます。`, "ok");
      } else {
        // 通常コンテンツ(画像1枚・動画・HTML)
        const file = files[0];

        // HTML種別の場合、アイコン画像が選ばれていれば先にアップロードしてURLを取得する
        let iconUrl = "";
        if (type === "html") {
          const iconFile = document.getElementById("htmlIconFile").files[0];
          if (iconFile) {
            setStatus(statusEl, "アイコン画像をアップロード中…", "");
            const iconRes = await fetch(WORKER_URL, {
              method: "POST",
              headers: {
                "Content-Type": iconFile.type || "application/octet-stream",
                "X-Upload-Password": encodeURIComponent(password),
                "X-Media-Type": "gallery-image",
                "X-File-Name": encodeURIComponent(iconFile.name),
              },
              body: iconFile,
            });
            const iconData = await iconRes.json();
            if (!iconData.ok) throw new Error(iconData.error || "アイコン画像のアップロードに失敗しました");
            iconUrl = iconData.url;
          }
        }

        setStatus(statusEl, "アップロード中です。画面を閉じずにお待ちください…", "");
        const res = await fetch(WORKER_URL, {
          method: "POST",
          headers: {
            "Content-Type": file.type || "application/octet-stream",
            "X-Upload-Password": encodeURIComponent(password),
            "X-Label": encodeURIComponent(label),
            "X-Media-Type": type,
            "X-File-Name": encodeURIComponent(file.name),
            "X-Slot": String(selectedSlot),
            ...(iconUrl ? { "X-Icon-Url": encodeURIComponent(iconUrl) } : {}),
          },
          body: file,
        });
        const data = await res.json();
        if (!data.ok) throw new Error(data.error || "アップロードに失敗しました");
        setStatus(statusEl, "アップロードが完了しました。数分後にモニターへ反映されます。", "ok");
      }

      document.getElementById("label").value = "";
      fileInput.value = "";
      document.getElementById("htmlIconFile").value = "";
      document.querySelectorAll(".slot-opt").forEach(n => n.classList.remove("selected"));
      selectedSlot = null;
    } catch (e) {
      setStatus(statusEl, "エラー: " + (e.message || "通信エラーが発生しました。時間をおいて再度お試しください。"), "err");
    } finally {
      submitBtn.disabled = false;
    }
  });

  // ---- スクリーンセーバーのアップロード ----
  const ssSubmitBtn = document.getElementById("ssSubmitBtn");
  const ssStatusEl = document.getElementById("ssStatus");

  ssSubmitBtn.addEventListener("click", async () => {
    const password = document.getElementById("ssPassword").value;
    const fileInput = document.getElementById("ssFile");
    const file = fileInput.files[0];

    if (!password || !file) {
      setStatus(ssStatusEl, "パスワードと動画ファイルを入力してください", "err");
      return;
    }

    ssSubmitBtn.disabled = true;
    setStatus(ssStatusEl, "アップロード中です。画面を閉じずにお待ちください…", "");

    try {
      const res = await fetch(WORKER_URL, {
        method: "POST",
        headers: {
          "Content-Type": file.type || "application/octet-stream",
          "X-Upload-Password": encodeURIComponent(password),
          "X-Media-Type": "screensaver",
          "X-File-Name": encodeURIComponent(file.name),
        },
        body: file,
      });
      const data = await res.json();
      if (data.ok) {
        setStatus(ssStatusEl, "スクリーンセーバーを更新しました。数分後に反映されます。", "ok");
        fileInput.value = "";
      } else {
        setStatus(ssStatusEl, "エラー: " + data.error, "err");
      }
    } catch (e) {
      setStatus(ssStatusEl, "通信エラーが発生しました。時間をおいて再度お試しください。", "err");
    } finally {
      ssSubmitBtn.disabled = false;
    }
  });

  function setStatus(el, text, cls){
    el.textContent = text;
    el.className = "status " + cls;
  }
</script>
</body>
</html>
